<!DOCTYPE html>
<html>
<head>
    
</head>
<body>
    <div class="container">
        <form novalidate>
            <label for="email">Email: </label><input type="email" id="email" name="email">
            <span class="error-msg"></span>
            <label for="country">Country: </label><input type="text" id="country" name="country">
            <span class="error-msg"></span>
            <label for="postal-code">Postal Code: </label><input type="text" id="postal-code" name="postal-code">
            <span class="error-msg"></span>
            <label for="password">Password: </label><input type="password" id="password" name="password">
            <span class="error-msg"></span>
            <label for="confirm-password">Confirm Password: </label><input type="password" id="confirm-password" name="confirm-password">
            <span class="error-msg"></span>
            <button type="submit">Submit</button>
        </form>
        
    </div>
</body>

</html>
